# EverRec 客户端配置示例（设计文档 4.6）
# 放在安装文件夹的 config/everrec.yaml，例如 D:\EverRec\config\everrec.yaml
# 相对路径都相对安装文件夹。只有 Windows 管理员能改这个文件。

server: https://everrec.hq.local      # 子公司填中转节点地址；留空则纯本地运行

location:              # 只能用英文和数字，会进文件路径
  state: HD            # 州
  district: PD         # 区
  building: A          # 楼栋
  floor: 3F            # 楼层
  number: "012"        # 编号
# 位置编号自动生成：HD-PD-A-3F-012

camera:
  type: usb            # usb；开发自测可用 test（FFmpeg 内置测试画面）
  device: ""           # Windows 填摄像头名称，Linux 填 /dev/video0；留空用默认

recording:
  quality: standard    # 画质：saver 省空间 / lean 偏省 / standard 标准（推荐，720P 10 帧）/ sharp 偏清晰 / max 清晰
  # 高级（一般不用填，填了就覆盖上面的画质）：
  # resolution: 720p   # 360p / 480p / 720p / 1080p
  # fps: 10            # 5 / 8 / 10 / 12 / 15
  # 码率不用填，按分辨率和帧率自动算。写错的值会自动改回默认并在管理网站上提示，不会停录。
  folder: recordings   # 默认在安装文件夹内
  local_quota_gb: 20
  watermark: true
  segment_seconds: 300

autostart: true
heartbeat_seconds: 30
