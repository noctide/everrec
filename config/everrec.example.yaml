# EverRec 客户端配置示例（设计文档 4.6）
# 放在安装文件夹的 config/everrec.yaml，例如 D:\EverRec\config\everrec.yaml
# 相对路径都相对安装文件夹。只有 Windows 管理员能改这个文件。

server: https://everrec.hq.local      # 子公司填中转节点地址；留空则纯本地运行

location:              # 只能用英文和数字，会进文件路径
  dept: FIN            # 部门
  section: AP          # 科室
  area: E              # 区域
  site: HQ             # 属地
  spot: F3             # 位置
  number: "012"        # 编号（哪一台）
  label: 三号收银台    # 可选，中文备注，只给人看，不进路径
# 位置编号自动生成（空的层级自动跳过）：FIN-AP-E-HQ-F3-012
# 旧配置里的 state / district / building / floor 仍可读，分别对应 dept / section / area / spot

camera:
  type: usb            # usb；开发自测可用 test（FFmpeg 内置测试画面）
  device: ""           # Windows 填摄像头名称，Linux 填 /dev/video0；留空用默认

recording:
  quality: standard    # 画质：saver 省空间 / lean 偏省 / standard 标准（推荐，720P 10 帧）/ sharp 偏清晰 / max 清晰
  # 高级（一般不用填，填了就覆盖上面的画质）：
  # resolution: 720p   # 360p / 480p / 720p / 1080p
  # fps: 10            # 5 / 8 / 10 / 12 / 15
  # 码率不用填，按分辨率和帧率自动算。写错的值会自动改回默认并在管理网站上提示，不会停录。
  folder: recordings   # 默认在安装文件夹内
  local_quota_gb: 20
  watermark: true
  # 一个录像文件多长（秒）。默认 1 小时：文件少、索引轻；
  # 代价是最新一段要录完才上传，回放最新画面最多晚这么久。
  segment_seconds: 3600

screenshot:              # 定时截屏：本地设置，服务器不改它
  enabled: false         # 开了就按间隔把当前屏幕存到安装文件夹的 screenshots/
  interval_seconds: 300  # 多久一张（60–3600 秒）
  keep_files: 2000       # 最多留多少张，超了删最旧的

autostart: true
heartbeat_seconds: 30
