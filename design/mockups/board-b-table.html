            <th style="width:6.5%">状态</th>

            <th style="width:8%">名称</th>
            <th style="width:9%">位置</th>
            <th style="width:10%">近 30 分钟</th>

            <th style="width:10%">当前分段</th>

            <th style="width:5.5%" class="num">待补传</th>
            <th style="width:6.5%" class="num">磁盘</th>
            <th style="width:5%">责任人</th>
            <th style="width:3.5%" class="num">操作</th>

        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
// 与 A 稿同一套示例数据。st: ok / warn（离线本地录制）/ bad（没在录像）/ lost（失联）
const DEVICES = [
  ["FIN-AP-E-HQ-F3-012", "3 号收银台", "ok",   "12 秒前", "", 0, "东区 · HQ · F3", "李慧"],
  ["FIN-AP-E-HQ-F3-015", "4 号收银台", "ok",   "8 秒前",  "", 0, "东区 · HQ · F3", "李慧"],
  ["FIN-AP-E-HQ-F3-018", "5 号收银台", "warn", "", "连不上服务器，正在本机录制", 46, "东区 · HQ · F3", "李慧"],
  ["FIN-AP-E-HQ-F3-021", "6 号收银台", "bad",  "", "录像文件 60 秒没有增长，已自动重启 2 次", 0, "东区 · HQ · F3", "李慧"],
  ["FIN-AP-E-HQ-F3-024", "一科办公室", "ok",   "5 秒前",  "", 0, "东区 · HQ · F3", "李慧"],
  ["FIN-AP-E-HQ-F3-027", "一科会议桌", "ok",   "9 秒前",  "", 0, "东区 · HQ · F3", "李慧"],
  ["FIN-AP-E-HQ-F3-030", "一科档案柜", "ok",   "2 秒前",  "", 0, "东区 · HQ · F3", "李慧"],
  ["FIN-AP-E-HQ-F3-033", "走廊入口",   "ok",   "21 秒前", "", 0, "东区 · HQ · F3", "李慧"],
  ["FIN-AP-W-HQ-F2-006", "西区收银台", "warn", "", "连不上服务器，正在本机录制", 12, "西区 · HQ · F2", "李慧"],
  ["FIN-AP-W-HQ-F2-009", "西区办公室", "ok",   "14 秒前", "", 0, "西区 · HQ · F2", "李慧"],
  ["FIN-AP-W-HQ-F2-012", "西区档案柜", "lost", "", "已经 6 小时没有消息，请去现场看看", 0, "西区 · HQ · F2", "李慧"],
  ["FIN-AP-W-HQ-F2-015", "西区走廊",   "ok",   "3 秒前",  "", 0, "西区 · HQ · F2", "李慧"],

  ["FIN-CS-E-HQ-F1-004", "二科办公室", "ok",   "17 秒前", "", 0, "东区 · HQ · F1", "王建国"],
  ["FIN-CS-E-HQ-F1-007", "二科会议桌", "ok",   "6 秒前",  "", 0, "东区 · HQ · F1", "王建国"],
  ["FIN-CS-E-HQ-F1-010", "二科档案柜", "ok",   "31 秒前", "", 0, "东区 · HQ · F1", "王建国"],
  ["FIN-CS-W-HQ-F1-003", "二科走廊",   "ok",   "11 秒前", "", 0, "西区 · HQ · F1", "王建国"],
  ["FIN-CS-W-HQ-F1-006", "备件柜",     "ok",   "26 秒前", "", 0, "西区 · HQ · F1", "王建国"],
  ["FIN-CS-W-HQ-F1-009", "打印区",     "ok",   "4 秒前",  "", 0, "西区 · HQ · F1", "王建国"],

  ["HR-PY-N-HQ-F5-001", "薪酬办公室", "ok",   "19 秒前", "", 0, "北区 · HQ · F5", "陈晓"],
  ["HR-PY-N-HQ-F5-004", "薪酬档案柜", "ok",   "7 秒前",  "", 0, "北区 · HQ · F5", "陈晓"],
  ["HR-PY-S-HQ-F5-007", "薪酬走廊",   "ok",   "23 秒前", "", 0, "南区 · HQ · F5", "陈晓"],
  ["HR-PY-S-HQ-F5-010", "薪酬会议桌", "ok",   "13 秒前", "", 0, "南区 · HQ · F5", "陈晓"],

  ["HR-RC-N-HQ-F2-002", "招聘面试间", "warn", "", "连不上服务器，正在本机录制", 4, "北区 · HQ · F2", "陈晓"],
  ["HR-RC-N-HQ-F2-005", "招聘办公室", "ok",   "28 秒前", "", 0, "北区 · HQ · F2", "陈晓"],
  ["HR-RC-N-HQ-F2-008", "招聘前台",   "ok",   "16 秒前", "", 0, "北区 · HQ · F2", "陈晓"],
  ["HR-RC-S-HQ-F2-011", "人事走廊",   "ok",   "33 秒前", "", 0, "南区 · HQ · F2", "陈晓"],
  ["HR-RC-S-HQ-F2-014", "人事会议桌", "ok",   "41 秒前", "", 0, "南区 · HQ · F2", "陈晓"],

  ["OP-EA-N-SH-F1-020", "东区中控台", "ok",   "10 秒前", "", 0, "东区 · SH · F1", "赵雪"],
  ["OP-EA-N-SH-F1-023", "东区入口",   "ok",   "24 秒前", "", 0, "东区 · SH · F1", "赵雪"],
  ["OP-EA-S-SH-F2-026", "东区巡检点", "ok",   "15 秒前", "", 0, "东区 · SH · F2", "赵雪"],
  ["OP-EA-S-SH-F2-029", "东区仓库",   "bad",  "", "摄像头被其他程序占用，录不到画面", 0, "东区 · SH · F2", "赵雪"],

  ["OP-WA-N-SH-F3-031", "西区中控台", "ok",   "18 秒前", "", 0, "西区 · SH · F3", "赵雪"],
  ["OP-WA-N-SH-F3-034", "西区入口",   "ok",   "29 秒前", "", 0, "西区 · SH · F3", "赵雪"],
  ["OP-WA-S-SH-F4-037", "西区仓库",   "ok",   "36 秒前", "", 0, "西区 · SH · F4", "赵雪"],
  ["OP-WA-S-SH-F4-040", "西区巡检点", "ok",   "44 秒前", "", 0, "西区 · SH · F4", "赵雪"]
];

const LABEL = { ok: "正常", warn: "离线本地", bad: "没在录像", lost: "失联" };
const rank = { bad: 0, lost: 0, warn: 1, ok: 2 };
const tone = (st) => (st === "warn" ? "warn" : st === "ok" ? "" : "bad");

// 心跳条：最近 30 分钟，每分钟一格。由编号决定，每次刷新同一台长得一样。
// 连不上服务器的（离线本地 / 失联）那段时间没有心跳，格子是空的 —— 一段空有多长，就是断了多久。
function spark(code, st) {
  const out = [];
  if (st === "lost") {
    for (let i = 0; i < 30; i++) out.push("none");
    return out;
  }
  if (st === "warn") {
    const gap = code.endsWith("018") ? 30 : code.endsWith("006") ? 22 : 12;
    for (let i = 0; i < 30; i++) out.push(i < 30 - gap ? "ok" : "none");
    return out;
  }
  let h = 7;
  for (const c of code) h = (h * 31 + c.charCodeAt(0)) % 9973;
  for (let i = 0; i < 30; i++) {
    h = (h * 1103515245 + 12345) % 2147483648;
    const r = h / 2147483648;
    if (st === "bad" && i >= 24) { out.push(i === 29 ? "bad" : "warn"); continue; }
    out.push(r > 0.985 ? "none" : r > 0.955 ? "warn" : "ok");
  }
  return out;
}

// 异常优先：严重度 → 编号。同一严重度内顺序固定，刷新不跳位。
const rows = DEVICES.slice().sort((a, b) => {
  const d = rank[a[2]] - rank[b[2]];
  return d !== 0 ? d : a[0].localeCompare(b[0]);
});

// 磁盘占用：示例值，按编号稳定生成，60~94%
function disk(code) {
  let h = 3;
  for (const c of code) h = (h * 37 + c.charCodeAt(0)) % 9973;
  return 60 + (h % 35);
}

document.getElementById("rows").innerHTML = rows.map(([code, name, st, ago, why, pend, loc, who]) => {
  const t = tone(st);
  const cls = t === "bad" ? "is-bad" : t === "warn" ? "is-warn" : "";
  const subCls = t === "bad" ? "tx-bad" : t === "warn" ? "tx-warn" : "tx-mute";
  const d = disk(code);
  return `<tr class="${cls}" title="${name}${why ? " · " + why : ""}">
    <td><span class="st"><span class="dot sm ${t || "ok"}"></span><span class="${t ? subCls : ""}">${LABEL[st]}</span></span></td>
    <td class="code">${code}</td>
    <td>${name}</td>
    <td class="tx-mute">${loc}</td>
    <td><span class="spark">${spark(code, st).map((s) => `<i class="${s}"></i>`).join("")}</span></td>
    <td class="${t ? subCls : "tx-mute"}">${why}</td>
    <td class="tx-mute">${st === "ok" ? "14-15 点" : st === "warn" ? "13-14 点" : "—"}</td>
    <td class="tx-mute">${ago || "—"}</td>
    <td class="num ${pend > 0 ? "tx-warn" : "tx-mute"}">${pend > 0 ? pend : "—"}</td>
    <td class="num ${d >= 90 ? "tx-bad" : d >= 80 ? "tx-warn" : "tx-mute"}">${d}%</td>
    <td class="who">${who}</td>
    <td><a class="act" href="#" aria-label="${code} 回放">回放</a></td>
  </tr>`;
}).join("");
</script>
