<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EverRec · 管理网站 · 录像回放</title>

<style>
body{margin:0;background:#FFFFFF}
a{color:#545454}a:hover{color:#383838}
button,select,input{font-family:inherit}
</style>

<style>
.preview-bar{font:13px -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:8px 16px;background:#1F1F1F;color:#D4D4D4;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.preview-bar a{color:#FFFFFF}
</style>
</head>
<body>
<div class="preview-bar"><strong>EverRec 界面设计稿</strong><span>管理网站 · 录像回放</span><span style="margin-left:auto"><a href="index.html">目录</a> · <a href="device-wall.html">设备墙</a> · <a href="playback.html">录像回放</a> · <a href="settings.html">设置</a> · <a href="client.html">录像客户端</a> · <a href="repair-tool.html">修复工具</a> · <a href="tray.html">托盘状态窗</a></span></div>
<div style=""><div id="dc-root"></div></div>
<template id="dc-template">

<div style="min-height: 100vh; background: #FFFFFF; color: #383838; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 0 24px; min-height: 56px; background: #F5F5F5; color: #383838; border-bottom: 1px solid #D4D4D4">
    <div style="display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#545454" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5" fill="#545454" stroke="none"></circle></svg>
      <span>EverRec 恒录</span>
    </div>
    <nav aria-label="主导航" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto">
      <a href="device-wall.html" style="padding: 8px 12px; border-radius: 6px; color: #474747; text-decoration: none">设备墙</a>
      <a href="playback.html" style="padding: 8px 12px; border-radius: 0; box-shadow: inset 0 -2px 0 #545454; color: #383838; font-weight: 600; text-decoration: none">录像回放</a>
      <a href="settings.html" style="padding: 8px 12px; border-radius: 6px; color: #474747; text-decoration: none">设置</a>
    </nav>
    <a href="#logout" style="color: #474747; font-size: 13px">退出</a>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: flex-start">
    <aside style="flex: 1 1 260px; max-width: 300px; padding: 20px; box-sizing: border-box; border-right: 1px solid #D4D4D4; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 600">检索条件</h2>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="q-dev" style="font-size: 13px; color: #666666">位置编号</label>
        <input id="q-dev" type="search" value="HD-PD-A-3F-014" style="height: 32px; border: 1px solid #D4D4D4; border-radius: 6px; padding: 0 10px; font-size: 14px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="q-date" style="font-size: 13px; color: #666666">日期</label>
        <input id="q-date" type="date" value="2026-10-15" style="height: 32px; border: 1px solid #D4D4D4; border-radius: 6px; padding: 0 8px; font-size: 14px">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="q-from" style="font-size: 13px; color: #666666">从</label>
          <input id="q-from" type="time" value="00:00" style="height: 32px; border: 1px solid #D4D4D4; border-radius: 6px; padding: 0 8px; font-size: 14px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="q-to" style="font-size: 13px; color: #666666">到</label>
          <input id="q-to" type="time" value="23:59" style="height: 32px; border: 1px solid #D4D4D4; border-radius: 6px; padding: 0 8px; font-size: 14px">
        </div>
      </div>
      <button type="button" style="height: 40px; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; background: #545454; color: #FFFFFF; font-size: 14px; font-weight: 500; cursor: pointer">检索</button>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; padding: 24px 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
        <div>
          <h1 style="margin: 0; font-size: 24px; font-weight: 600"><span style="font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">HD-PD-A-3F-014</span> · 2026-10-15</h1>
        </div>
        <div style="font-size: 13px; color: #666666">当日覆盖率 <strong style="color: #383838">83.7%</strong> · 缺口 1 段（离线未补传）</div>
      </div>

      <section aria-label="播放器" style="background: #3F3F3F; border-radius: 6px; overflow: hidden">
        <div style="position: relative; aspect-ratio: 16 / 9; max-height: 460px; width: 100%; display: flex; align-items: center; justify-content: center">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#8C8C8C" stroke-width="1.5" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>
          <span style="position: absolute; left: 14px; top: 12px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; color: #EBEBEB">2026-10-15 {{cursorLabel}}</span>
          <span style="position: absolute; right: 14px; top: 12px; font-size: 12px; color: #D4D4D4">640×360 · 5 fps</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; background: #363636; color: #EBEBEB">
          <button type="button" aria-label="后退 5 分钟" style="width: 44px; height: 36px; border: 1px solid #595959; border-radius: 6px; background: transparent; color: #EBEBEB; cursor: pointer">−5m</button>
          <button type="button" aria-label="播放" style="width: 44px; height: 36px; border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; background: #545454; color: #FFFFFF; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg>
          </button>
          <button type="button" aria-label="前进 5 分钟" style="width: 44px; height: 36px; border: 1px solid #595959; border-radius: 6px; background: transparent; color: #EBEBEB; cursor: pointer">+5m</button>
          <div role="group" aria-label="播放速度" style="display: flex; gap: 4px; margin-left: 8px">
            <template data-for="{{speeds}}" data-as="s" hint-placeholder-count="4">
              <button type="button" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
            </template>
          </div>
          <div style="margin-left: auto; display: flex; gap: 8px">
            <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #595959; border-radius: 6px; background: transparent; color: #EBEBEB; cursor: pointer">导出时段</button>
            <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #595959; border-radius: 6px; background: transparent; color: #EBEBEB; cursor: pointer">加锁留证</button>
          </div>
        </div>
      </section>

      <section aria-label="24 小时时间轴" style="background: #FFFFFF; border: 1px solid #D4D4D4; border-radius: 6px; padding: 16px 18px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-bottom: 12px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 600">24 小时时间轴 · 点击跳转</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #666666">
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 10px; border-radius: 2px; background: #545454"></span>正常</span>
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 10px; border-radius: 2px; background: #A6A6A6"></span>已修复</span>
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(135deg, #1A1A1A 0 3px, #E8E8E8 3px 6px)"></span>部分恢复</span>
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 10px; border-radius: 2px; border: 1px dashed #8C8C8C"></span>缺口</span>
          </div>
        </div>
        <div style="position: relative; height: 40px; background: #F0F0F0; border: 1px dashed #B3B3B3; border-radius: 6px">
          <template data-for="{{bars}}" data-as="b" hint-placeholder-count="6">
            <button type="button" onClick="{{b.pick}}" aria-label="{{b.aria}}" style="{{b.style}}"></button>
          </template>
          <span aria-hidden="true" style="{{cursorStyle}}"></span>
        </div>
        <div style="position: relative; height: 18px; margin-top: 6px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; color: #666666">
          <template data-for="{{ticks}}" data-as="t" hint-placeholder-count="7">
            <span style="{{t.style}}">{{t.label}}</span>
          </template>
        </div>
      </section>

      <section aria-label="分段列表" style="background: #FFFFFF; border: 1px solid #D4D4D4; border-radius: 6px; overflow: hidden">
        <div style="padding: 14px 18px; border-bottom: 1px solid #D4D4D4; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 600">分段</h2>
          <span style="font-size: 13px; color: #666666">每段 5 分钟 · 共 241 段 · 显示 09:50 起</span>
        </div>
        <div style="overflow-x: auto">
          <table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px">
            <thead>
              <tr style="text-align: left; color: #666666; background: #F5F5F5">
                <th style="padding: 10px 18px; font-weight: 500">时间段</th>
                <th style="padding: 10px 12px; font-weight: 500">完整性</th>
                <th style="padding: 10px 12px; font-weight: 500">同步</th>
                <th style="padding: 10px 12px; font-weight: 500">大小</th>
                <th style="padding: 10px 18px; font-weight: 500">操作</th>
              </tr>
            </thead>
            <tbody>
              <template data-for="{{rows}}" data-as="r" hint-placeholder-count="5">
                <tr style="border-top: 1px solid #F0F0F0">
                  <td style="padding: 10px 18px; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">{{r.span}}</td>
                  <td style="padding: 10px 12px"><span style="{{r.badge}}">{{r.integrity}}</span></td>
                  <td style="padding: 10px 12px; color: #666666">{{r.sync}}</td>
                  <td style="padding: 10px 12px; color: #666666">{{r.size}}</td>
                  <td style="padding: 10px 18px"><a href="#play">播放</a> · <a href="#download">下载</a></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>
</template>
<script src="runtime.js"></script>
<script>
(function () {

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { speed: '1×', cursor: 9.92 };
  }
  renderVals() {
    const color = { ok: '#545454', fix: '#A6A6A6', part: 'repeating-linear-gradient(135deg, #1A1A1A 0 3px, #E8E8E8 3px 6px)' };
    const name = { ok: '正常', fix: '已修复', part: '部分恢复' };
    const segs = [
      { a: 0, b: 6.4, k: 'ok' },
      { a: 6.4, b: 6.5, k: 'fix' },
      { a: 6.5, b: 10.0, k: 'ok' },
      { a: 10.0, b: 10.0833, k: 'part' },
      { a: 14.0, b: 22.5, k: 'ok' },
      { a: 22.5, b: 24, k: 'ok' }
    ];
    const hm = (h) => {
      const m = Math.round(h * 60);
      return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    };
    const bars = segs.map((s) => ({
      aria: name[s.k] + ' ' + hm(s.a) + ' 至 ' + hm(s.b),
      pick: () => this.setState({ cursor: s.a }),
      style: 'position: absolute; top: 4px; bottom: 4px; border: none; padding: 0; cursor: pointer; border-radius: 2px; left: ' + (s.a / 24 * 100) + '%; width: calc(' + ((s.b - s.a) / 24 * 100) + '% - 1px); background: ' + color[s.k]
    }));
    const ticks = [0, 4, 8, 12, 16, 20, 24].map((h) => ({
      label: String(h).padStart(2, '0') + ':00',
      style: 'position: absolute; top: 0; transform: translateX(' + (h === 0 ? '0' : h === 24 ? '-100%' : '-50%') + '); left: ' + (h / 24 * 100) + '%'
    }));
    const c = this.state.cursor;
    const speeds = ['1×', '2×', '4×', '8×'].map((l) => {
      const on = l === this.state.speed;
      return {
        label: l,
        pick: () => this.setState({ speed: l }),
        style: 'min-width: 44px; height: 36px; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid ' + (on ? '#545454' : '#595959') + '; background: ' + (on ? '#545454' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#EBEBEB')
      };
    });
    const badge = (bg, fg) => 'padding: 2px 8px; border-radius: 2em; font-size: 12px; background: ' + bg + '; color: ' + fg;
    const rows = [
      { span: '09:50 – 09:55', integrity: '正常', badge: badge('#F0F0F0', '#595959'), sync: '已同步', size: '2.3 MB', user: 'zhangwei' },
      { span: '09:55 – 10:00', integrity: '正常', badge: badge('#F0F0F0', '#595959'), sync: '已同步', size: '2.1 MB', user: 'zhangwei' },
      { span: '10:00 – 10:05', integrity: '部分恢复 · 缺 41 秒', badge: badge('#E8E8E8', '#1A1A1A'), sync: '已同步', size: '1.8 MB', user: 'zhangwei' },
      { span: '10:05 – 14:00', integrity: '缺口', badge: badge('#F0F0F0', '#595959'), sync: '本地待补传 46 段', size: '—', user: 'lihua' },
      { span: '14:00 – 14:05', integrity: '正常', badge: badge('#F0F0F0', '#595959'), sync: '已同步', size: '2.4 MB', user: 'lihua' }
    ];
    return {
      bars, ticks, speeds, rows,
      cursorLabel: hm(c) + ':00',
      cursorStyle: 'position: absolute; top: -6px; bottom: -6px; width: 2px; background: #383838; left: ' + (c / 24 * 100) + '%'
    };
  }
}

window.__dcBoot(Component, {});
})();
</script>
</body>
</html>
