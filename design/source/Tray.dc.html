<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EverRec 托盘状态窗</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#545454}a:hover{color:#383838}
</style>
</helmet>
<div style="width: 360px; height: 320px; box-sizing: border-box; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; color: #383838; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; border: 1px solid #D4D4D4; border-radius: 6px">
  <div style="display: flex; align-items: center; gap: 12px">
    <span style="width: 40px; height: 40px; border-radius: 50%; background: #F0F0F0; display: flex; align-items: center; justify-content: center">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #595959"></span>
    </span>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 17px; font-weight: 600">正在录像</span>
      <span style="font-size: 13px; color: #666666">本工位的画面正在被录制</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; padding: 12px 14px; background: #F5F5F5; border-radius: 6px">
    <span style="color: #666666">位置编号</span><span style="font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">HD-PD-A-3F-012</span>
    <span style="color: #666666">已连续录制</span><span>14 天 6 小时</span>
    <span style="color: #666666">服务器</span><span>已连接 · 已同步</span>
    <span style="color: #666666">本地空间</span><span>已用 1.2 GB / 20 GB</span>
  </div>

  <p style="margin: 0; font-size: 12px; color: #666666; line-height: 1.6">录像由公司统一管理，用于设备操作区安全记录。如有疑问请联系设备管理员。</p>

  <div style="margin-top: auto; display: flex; justify-content: space-between; font-size: 12px; color: #666666">
    <span>EverRec Agent 1.0.0</span>
    <a href="Client.dc.html">打开客户端</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
