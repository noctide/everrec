[project]
name = "everrec-agent"
version = "0.1.0"
description = "EverRec 采集端：常驻录制服务"
requires-python = ">=3.12"
dependencies = [
    "everrec-core",
    "httpx>=0.27",
    "psutil>=6",
]

[project.scripts]
everrec-agent = "everrec_agent.cli:main"
everrec-screen = "everrec_agent.screen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everrec_agent"]

[tool.uv.sources]
everrec-core = { workspace = true }
