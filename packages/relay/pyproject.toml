[project]
name = "everrec-relay"
version = "0.2.0"
description = "EverRec 子公司中转节点：对子公司 Agent 提供与主服务器相同的接口，对主服务器提供增量拉取（tasks.md WP10）"
requires-python = ">=3.12"
dependencies = [
    "everrec-core",
    "everrec-server",
]

[project.scripts]
everrec-relay = "everrec_relay.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everrec_relay"]

[tool.uv.sources]
everrec-core = { workspace = true }
everrec-server = { workspace = true }
