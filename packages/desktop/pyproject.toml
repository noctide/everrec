[project]
name = "everrec-desktop"
version = "0.2.0"
description = "EverRec 桌面端：修复工具、托盘状态窗、录像客户端"
requires-python = ">=3.12"
dependencies = [
    "everrec-core",
    "PySide6>=6.6",
]

[project.scripts]
everrec-desktop = "everrec_desktop.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everrec_desktop"]

[tool.uv.sources]
everrec-core = { workspace = true }
