[project]
name = "everrec-desktop"
version = "0.1.0"
description = "EverRec 桌面端：修复工具、托盘状态窗、录像客户端"
requires-python = ">=3.12"
dependencies = [
    "everrec-core",
    "PySide6>=6.6",
]

[project.scripts]
everrec-client = "everrec_desktop.client:main"
everrec-tray = "everrec_desktop.tray:main"
everrec-repair = "everrec_desktop.repair_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everrec_desktop"]

[tool.uv.sources]
everrec-core = { workspace = true }
