[project]
name = "everrec-core"
version = "0.1.0"
description = "EverRec 公共核心库：配置、录制命令、分段、健康检查、修复（Agent / 服务端 / 修复工具共用）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everrec_core"]
